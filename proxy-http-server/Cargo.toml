[package]
name = "proxy-http-server"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "proxy-http-server"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "proxy-http-server"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
deadpool-amqprs = { workspace = true }
futures = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde-aux = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
intersect-ingress-proxy-common = { path = "../shared-deps", version = "0.1.0" }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "tracing", "trace", "util"] }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.jemallocator]
version = "0.5"
