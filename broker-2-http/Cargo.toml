[package]
name = "broker-2-http"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "broker-2-http"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "broker-2-http"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
amqprs = { workspace = true }
config = { workspace = true }
deadpool-amqprs = { workspace = true }
futures = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde-aux = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
intersect-ingress-proxy-common = { path = "../shared-deps", version = "0.1.0" }
axum = { version = "0.8.1", features = ["macros"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["request-id", "tracing", "trace", "util"] }
